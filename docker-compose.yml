services:
  # =========================================================================
  # 1. GANACHE (Blockchain Local Ethereum)
  # =========================================================================
  ganache:
    image: trufflesuite/ganache:latest
    container_name: facesentinel-ganache
    command: >
      --wallet.deterministic
      --chain.chainId 1337
      --server.host 0.0.0.0
      --server.port 7545
      --database.dbPath /app/ganache_data
    ports:
      - "7545:7545"
    volumes:
      - ganache-data:/app/ganache_data
    restart: unless-stopped
    networks:
      - facesentinel-net

  # =========================================================================
  # 2. BACKEND (FastAPI + DeepFace + ChromaDB + Anti-Spoofing)
  # =========================================================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: facesentinel-backend
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - deepface-cache:/root/.deepface
    env_file:
      - path: .env
        required: false
    environment:
      - SQLITE_DB_PATH=/app/data/sql/database.db
      - CHROMA_DB_PATH=/app/data/chromadb
      - TEMP_IMAGES_PATH=/app/data/temp_images
      - BLOCKCHAIN_RPC_URL=http://ganache:7545
      - WEB3_PROVIDER_URI=http://ganache:7545
      - CHAIN_ID=1337
      - ADMIN_ADDRESS=0x90F8bf6A479f320ead074411a4B0e7944Ea8c9C1
      - ADMIN_PRIVATE_KEY=0x4f3edf983ac636a65a842ce7c78d9aa706d3b113bce9c46f30d7d21715b23b1d
      - INITIAL_ADMIN_USERNAME=admin
      - INITIAL_ADMIN_PASSWORD=admin123
      - JWT_SECRET_KEY=facesentinel-super-secret-key-change-in-production
      - HW_CLIENT_SECRET=secret_door_01
      - PYTHONUNBUFFERED=1
    depends_on:
      ganache:
        condition: service_started
    restart: unless-stopped
    networks:
      - facesentinel-net

  # =========================================================================
  # 3. FRONTEND (React + Vite + Tailwind v4 + Nginx Reverse Proxy)
  # =========================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: facesentinel-frontend
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - facesentinel-net

volumes:
  deepface-cache:
    driver: local
  ganache-data:
    driver: local

networks:
  facesentinel-net:
    driver: bridge
